.bank{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gl{stroke:var(--line);stroke-width:4;stroke-dasharray:18 14;fill:none}
@media (prefers-reduced-motion:no-preference){.sm{stroke-dasharray:1000;stroke-dashoffset:1000;animation:stk .55s linear forwards}}
@keyframes stk{to{stroke-dashoffset:0}}
.info{display:grid;gap:14px;min-width:0}
.bigch{display:flex;align-items:center;gap:8px}

.rd{display:grid;gap:6px}

.wc .hz{font-size:34px;line-height:1.1;font-weight:500}

.wc .wd{font-size:13px}
.hidezy .zy{visibility:hidden}
.struct{display:grid;gap:8px}
.pcases{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.pcase{background:var(--card);border-radius:18px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.pcase svg{width:100%;height:auto;display:block;font-family:var(--body)}
.pcase .ptxt{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:0 4px 4px}
.pcase .pn{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc,var(--soc));color:#fff;font-family:var(--display);font-size:13px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.vw{display:grid;gap:2px;align-content:start;text-align:left;padding:9px 12px;border-radius:14px;border:2px solid color-mix(in srgb,var(--en) 45%,var(--line));background:var(--card);color:var(--ink);cursor:pointer;font:inherit;min-width:0}
.vw b{font-size:17px;overflow-wrap:anywhere}.vw .vzh{font-size:14px;color:var(--muted)}.vw small{font-size:12px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.vw:hover,.vw.said{border-color:var(--en);background:color-mix(in srgb,var(--en) 14%,var(--card))}
#vbox.hidezh .vzh{color:transparent;background:color-mix(in srgb,var(--muted) 25%,var(--card));border-radius:6px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.fig{margin:0;background:var(--card);border-radius:18px;padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.fig figcaption{font-family:var(--display);font-weight:900}
.fig svg{width:100%;height:auto;display:block;overflow:visible}
.fig p{margin:0;font-size:14px}
.fig .ft{fill:var(--ink);font-family:var(--body);font-size:14px}.fig .fm{fill:var(--muted)}
.fig .fh{fill:#c2410c}.fig .fw{fill:#fff}.fig .fhb{fill:color-mix(in srgb,var(--math) 70%,var(--ink))}.fig .fhc{fill:#c26a12}
.fig .fl{stroke:var(--ink);stroke-width:1.6;fill:none}.fig .fl.fg-n{fill:color-mix(in srgb,var(--muted) 22%,var(--card))}.fig .ac{stroke:#e8590c;stroke-width:2.4;fill:none}.fig .sb{stroke:color-mix(in srgb,var(--math) 80%,var(--ink));stroke-width:2.4;fill:none}.fig .sc{stroke:#e8590c;stroke-width:2;fill:none}.fig .thick{stroke-width:4}.fig .fdash{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 4;fill:none;opacity:.6}.fig .fa{fill:var(--ink)}.fig .fs{stroke:var(--ink);stroke-width:1;opacity:.45}
.fg-b{fill:color-mix(in srgb,var(--math) 55%,var(--card));stroke:var(--ink);stroke-width:1.2}
.fg-c{fill:color-mix(in srgb,#f39a4a 60%,var(--card));stroke:var(--ink);stroke-width:1.2}
.fg-d{fill:color-mix(in srgb,#e8708a 55%,var(--card));stroke:var(--ink);stroke-width:1.2}
.fg-n{fill:color-mix(in srgb,var(--muted) 22%,var(--card));stroke:var(--ink);stroke-width:1.2}
.kb,.kc,.kd{border-radius:6px;padding:0 4px;font-weight:700}
.kb{background:color-mix(in srgb,var(--math) 40%,var(--card))}.kc{background:color-mix(in srgb,#f39a4a 45%,var(--card))}.kd{background:color-mix(in srgb,#e8708a 40%,var(--card))}
:root[data-theme="dark"] .fig .fh{fill:#fdba74}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fig .fh{fill:#fdba74}}
.srow{display:grid;grid-template-columns:4.5em 1fr;gap:10px;align-items:start}
.srow>b{font-family:var(--display);font-size:14px;text-align:center;border-radius:8px;padding:2px 0;background:color-mix(in srgb,var(--acc,var(--zh)) 24%,var(--card))}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:420px;font-size:14px}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.tbl th{background:color-mix(in srgb,var(--acc,var(--zh)) 18%,var(--card))}
.fl{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.fl .blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--acc,var(--zh));margin:0 2px}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow input{flex:1 1 160px;min-width:0;font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.frow input.ok{border-color:var(--sci);background:color-mix(in srgb,var(--sci) 14%,var(--card))}
.frow input.no{border-color:var(--zh)}
.fres{font-size:14px}
.fres b.ok{color:var(--sci)} .fres b.no{color:var(--zh)}
ol.steps{margin:0;padding-left:1.4em;display:grid;gap:4px}
.srow small{display:block;color:var(--muted)}
dl.terms{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px}
dl.terms dt{font-weight:700}
dl.terms dd{margin:0;min-width:0}
.wide{grid-column:1/-1}
@media (prefers-reduced-motion:no-preference){.wave{animation:drift 9s ease-in-out infinite alternate}}
@keyframes drift{to{transform:translateX(18px)}}

/* ===== 新版外殼與學習系統樣式（沿用島嶼生活風的 token：奶油卡片、木頭招牌、五科代表色） ===== */
:root{--ok:var(--sci);--bad:var(--zh);--toph:62px;--sel:color-mix(in srgb,var(--math) 22%,var(--card))}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--toph) + 12px)}
html:has(.ov:not([hidden])){overflow:hidden}
html.bigtext body{font-size:17.5px}
html.bigtext .hint,html.bigtext .expl,html.bigtext .state{font-size:15px}
.skip{position:absolute;left:-999px;top:0;z-index:60;background:var(--card);color:var(--ink);padding:8px 14px;border-radius:0 0 12px 0}
.skip:focus{left:0}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
a.lk{color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent);text-underline-offset:3px}
a.lk:hover{text-decoration-color:var(--ink)}
a:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--math);outline-offset:2px}
.tag.soft{background:var(--sand);color:var(--ink)}
button.ghost{background:transparent;box-shadow:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
button.danger{background:color-mix(in srgb,var(--bad) 22%,var(--card));box-shadow:0 3px 0 var(--bad)}
button:disabled{opacity:.55}
.opts button:disabled,.chip:disabled{opacity:1}

/* 上方列 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--card)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);box-shadow:0 3px 0 var(--btnb),0 8px 18px var(--shadow)}
.top-in{max-width:1180px;margin:0 auto;height:var(--toph);display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{background:none;box-shadow:none;padding:0;border-radius:14px;flex:none}
.brand:active{transform:none;box-shadow:none}
.brand-sign{display:block;font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:.06em;background:var(--wood);color:var(--signtxt);padding:3px 16px 5px;border-radius:14px;box-shadow:0 4px 0 var(--woodd);white-space:nowrap}
.cd{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 8px;border-radius:16px;text-align:left;flex:none}
.cd-n{font-family:var(--display);font-weight:900;font-size:26px;line-height:1;color:var(--wood);font-variant-numeric:tabular-nums;min-width:1.3em;text-align:center}
.cd-t{display:grid;line-height:1.2}.cd-t b{font-size:13px}.cd-t small{font-size:11px;color:var(--muted);max-width:11em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnav{display:flex;gap:6px;margin-left:auto}
.tb{position:relative;display:flex;align-items:center;gap:6px;padding:8px 13px;font-size:14px;font-weight:700;background:transparent;box-shadow:none}
.tb:hover,.tb.on{background:var(--btn);box-shadow:0 3px 0 var(--btnb)}
.tb .ic,.tb svg{width:19px;height:19px}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;box-sizing:border-box;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;line-height:19px;text-align:center;font-variant-numeric:tabular-nums}
.top .hme{padding:4px 12px 4px 4px;flex:none}
.top .hav{width:34px;height:34px}
@media (max-width:900px){.tb span{display:none}.tb{padding:9px}.cd-t small{display:none}}
@media (max-width:620px){:root{--toph:56px}.top-in{gap:6px}.brand-sign{font-size:15px;padding:3px 10px 4px;letter-spacing:.02em}.top .hmt{display:none}.top .hme{padding:3px}.cd{padding:3px 9px 3px 5px;gap:5px}.cd-n{font-size:21px}.cd-t b{font-size:11px}.tnav{gap:0}.tb{padding:8px 7px}}
@media (max-width:400px){.cd-t{display:none}.brand-sign{font-size:14px;padding:3px 8px 4px}}

/* 外框與島嶼捷徑 */
.wrap{max-width:1180px;padding-block:16px 40px;gap:16px}
.qnav{flex:none;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.qnav button{flex:none;background:var(--card)}

@media (max-width:600px){.qnav button small{display:none}}
.foot{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:0 6px}
body[data-view=study] .qnav button small{display:none}
.panel{padding:22px;gap:16px}
.panel:focus{outline:none}
@media (max-width:600px){.panel{padding:16px 14px;border-radius:26px;outline-offset:-7px}.box{padding:14px;border-radius:20px}}
.ph h2{text-wrap:balance}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;color:#c2410c;background:color-mix(in srgb,#f59e0b 22%,var(--card));border-radius:99px;padding:2px 12px}
:root[data-theme="dark"] .streak{color:#fdba74}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .streak{color:#fdba74}}
.h3row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.h3btns{display:flex;flex-wrap:wrap;gap:8px}
.fcbtn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-family:var(--body);font-weight:500;padding:6px 14px;background:var(--card)}
.subact{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* 總複習島 */
.coach{background:color-mix(in srgb,var(--hub) 20%,var(--card));border-radius:22px;padding:14px 18px;display:grid;gap:6px;justify-items:start}

.hubgrid>.wide{grid-column:1/-1}
.hubgrid>.today{grid-column:span 4}.hubgrid>.today+*{grid-column:span 2}
@media (max-width:980px){.hubgrid>.today,.hubgrid>.today+*{grid-column:1/-1}}
@media (max-width:700px){.hubgrid>*{grid-column:1/-1}}
.tp .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.tp .grid3{grid-template-columns:minmax(0,1fr)}}
.missions{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:10px 14px}
.mi>div{display:grid;gap:1px;min-width:0}.mi small{color:var(--muted);font-size:13px;line-height:1.7}
.mchk{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--btnb);display:grid;place-items:center;color:#fff;flex:none}
.mi.ok .mchk{background:var(--ok);border-color:var(--ok)}
.mi.ok b{color:var(--muted)}
.mi button{white-space:nowrap}
@media (max-width:460px){.mi{grid-template-columns:auto minmax(0,1fr)}.mi button{grid-column:2;justify-self:start}}
.tstat{margin:0;font-size:14px;color:var(--muted)}.tstat b{color:var(--ink);font-variant-numeric:tabular-nums}
.subjbars{display:grid;gap:8px}
.sbar{display:grid;grid-template-columns:5.2em minmax(0,1fr) 5.4em;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:7px 12px;box-shadow:0 2px 0 var(--line);text-align:left}
.sn{display:flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap}
.sn .hexb{width:22px;height:25px;font-size:11px}
.mtrack{display:block;height:10px;border-radius:99px;background:var(--line);overflow:hidden;min-width:0}
.mtrack i{display:block;height:100%;border-radius:99px;min-width:0;transition:width .4s ease}
.sv{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;font-size:14px}.sv small{color:var(--muted);font-weight:400}
.exbtns{display:flex;flex-wrap:wrap;gap:8px}.exbtns button{padding:8px 14px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:132px}
.wk.wide14{grid-template-columns:repeat(14,1fr);gap:5px}
.wkc{display:grid;grid-template-rows:16px 1fr 18px;gap:3px;height:100%;justify-items:center;min-width:0}
.wkn{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wkb{position:relative;width:100%;max-width:34px;background:color-mix(in srgb,var(--line) 45%,transparent);border-radius:8px 8px 3px 3px;overflow:hidden}
.wkb i,.wkb b{position:absolute;left:0;right:0;bottom:0;border-radius:8px 8px 0 0}
.wkb i{background:var(--line)}.wkb b{background:var(--ok)}
.wkd{font-size:12px;color:var(--muted)}
ul.plan li{align-items:center}ul.plan .d{min-width:5.6em}

/* 主題島 */
.lgroup{display:grid;gap:10px}.lgroup h3{margin:0;font-family:var(--display)}
.lessons{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.lesson{position:relative;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:start;background:var(--sand)}
.lesson .ln{grid-row:span 3;font-family:var(--display);font-weight:900;font-size:13px;min-width:2.1em;text-align:center;padding:3px 6px;border-radius:9px;background:var(--acc);color:#4a3720}
.lesson b{min-width:0;overflow-wrap:anywhere}
.lbar{display:block;height:6px;border-radius:9px;background:var(--line);overflow:hidden}.lbar i{display:block;height:100%;background:var(--acc)}
.lesson .state{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.lesson.next{box-shadow:0 4px 0 var(--acc);outline:2px solid var(--acc);outline-offset:-2px}
.lesson em{font-style:normal;font-weight:700;font-size:11px;background:var(--acc);color:#4a3720;border-radius:99px;padding:0 8px;margin-left:auto}

/* 課程分頁 */
.lhead{display:grid;gap:10px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph) + 6px);z-index:5;display:flex;gap:6px;background:var(--sand);border-radius:99px;padding:5px;box-shadow:0 3px 0 var(--line);overflow-x:auto;justify-self:start;max-width:100%;box-sizing:border-box}
.tabs button{flex:none;background:transparent;box-shadow:none;font-family:var(--display);font-weight:700;font-size:15px;padding:7px 20px;color:var(--muted)}
.tabs button.on{background:var(--acc,var(--hub));color:#4a3720;box-shadow:0 3px 0 color-mix(in srgb,var(--acc,var(--hub)),#4a3720 30%)}
.tp{display:grid;gap:14px;min-width:0}
.tp>.box{min-width:0}
.lnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:2px dashed var(--line);padding-top:16px}
.lnav button{max-width:100%;text-align:left}
.qtools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.sw2{display:inline-flex;grid-template-columns:none;align-items:center;gap:8px;font-size:14.5px;color:var(--ink);cursor:pointer}
.prev{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:700;border-radius:99px;padding:0 9px;vertical-align:2px;white-space:nowrap;font-family:var(--body)}
.prev.ok{background:color-mix(in srgb,var(--ok) 28%,var(--card));color:var(--ink)}
.prev.no{background:color-mix(in srgb,var(--bad) 28%,var(--card));color:var(--ink)}
#quizGrid.todo .was-ok,#quizGrid.todo details.alldone{display:none}
.tutor{display:grid;gap:8px;justify-items:start}
.aibtn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:6px 14px;background:color-mix(in srgb,var(--soc) 22%,var(--card));box-shadow:0 3px 0 color-mix(in srgb,var(--soc) 60%,var(--btnb))}

.ainame{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.aitxt{white-space:pre-wrap}

/* 統計卡 */
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--sand);border-radius:20px;padding:12px 16px;display:grid;gap:2px}
.stat b{font-family:var(--display);font-weight:900;font-size:34px;line-height:1.1;color:var(--wood);font-variant-numeric:tabular-nums}
.stat b small{font-size:15px;color:var(--ink);margin-left:2px}
.stat span{font-size:13px;color:var(--muted)}
.stat.hot{background:color-mix(in srgb,var(--bad) 20%,var(--card))}
.empty.big{padding:34px 18px;font-size:16px;line-height:2}

/* 錯題本 */
.mfilter .chip.on{background:var(--hub);color:#4a3720}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.mcard{background:var(--sand);border-radius:20px;padding:12px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.mcard.due{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--bad) 60%,transparent)}
.mtop{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px}

      ${g.sents.map((s,j)=>`<div class="di" data-j="${gi}_${j}"><div class="ds">(${j+1}) ${s[0].replace("＿",'<span class="blank">　</span>')}</div><div class="avsw">${g.parts.map(p=>p[1]).slice().sort().map(c=>`<button type="button" class="chip" data-c="${c}">${c}</button>`).join("")}</div><div class="fres" hidden></div></div>`).join("")}</div>`).join("");
    if(d.type==="fix")return d.items.map((it,j)=>`<div class="di" data-j="${j}"><div class="ds fixs">${j+1}. ${[...it.s].map(c=>/[，。、！？「」：；]/.test(c)?c:`<button type="button" class="fc">${c}</button>`).join("")}</div><div class="frow" hidden><span>把「<b class="fw"></b>」改成</span><input type="text" id="fx_${si}_${j}" maxlength="1" autocomplete="off" aria-label="正確的字"><button type="button" class="chk">對答案</button></div><div class="fres" hidden></div></div>`).join("");
    if(d.type==="cloze")return `<p class="bank">詞語：${d.bank.map(b=>`<span class="tag" style="background:var(--sand);color:var(--ink)">${b}</span>`).join(" ")}</p>`+d.items.map((it,j)=>`<div class="di" data-j="${j}"><div class="ds">${j+1}. ${it.s.replace("＿",'<span class="blank wide2">　</span>')}</div><div class="avsw">${d.bank.map(b=>`<button type="button" class="chip" data-c="${b}">${b}</button>`).join("")}</div><div class="fres" hidden></div></div>`).join("");
    if(d.type==="sense")return `<p class="bank">「${d.word}」的字義：${d.defs.map((x,i)=>`<b>${"①②③④"[i]}</b>${x}`).join("　")}</p>`+d.items.map((it,j)=>`<div class="di" data-j="${j}"><div class="ds">${j+1}. ${it.s}</div><div class="avsw">${chips(d.defs.map((x,i)=>"①②③④"[i]+x))}</div><div class="fres" hidden></div></div>`).join("");
    if(d.type==="cls")return d.items.map((it,j)=>`<div class="di" data-j="${j}"><div class="ds">${j+1}. ${it.s}</div><div class="avsw">${d.labels.map((t,i)=>`<button type="button" class="chip" data-v="${i}">${t}</button>`).join("")}</div><div class="fres" hidden></div></div>`).join("");
    if(d.type==="mc")return d.items.map((it,j)=>`<div class="di" data-j="${j}"><div class="ds">${j+1}. ${it.s}</div><div class="avsw">${it.o.map((t,i)=>`<button type="button" class="chip" data-v="${i}">${"①②③④"[i]} ${t}</button>`).join("")}</div><div class="fres" hidden></div></div>`).join("");
    if(d.type==="num")return d.items.map((it,j)=>{let b=0;return `<div class="di" data-j="${j}"><div class="ds numq">${j+1}. ${it.s.replace(/＿/g,()=>`<input type="text" class="nb" id="nb_${si}_${j}_${b}" data-b="${b++}" autocomplete="off" inputmode="decimal" aria-label="第 ${j+1} 題第 ${b} 格">`)}</div><div class="frow"><button type="button" class="chk">對答案</button><button type="button" class="show" hidden>看解法</button></div><div class="fres" hidden></div></div>`}).join("");
    if(d.type==="make")return d.items.map((it,j)=>`<div class="di mk" data-j="${j}"><div class="ds">${j+1}. <b>${it.p}</b></div><textarea id="mk_${si}_${j}" rows="2" placeholder="用「${it.p}」寫一個句子" aria-label="用${it.p}造句"></textarea><div class="frow"><button type="button" class="chk">看參考例句</button></div><div class="fres" hidden></div></div>`).join("")+`<p class="hint" style="margin:0">造句沒有標準答案，寫完請爸媽或老師看看；句子通順、用對連接詞就可以。</p>`;
    return "";
  };
  const n=d=>d.type==="comp"?d.groups.reduce((s,g)=>s+g.sents.length,0):d.type==="make"?0:d.items.length;
  return `<div class="box wide drillwrap"><h3>題型練習</h3><p class="hint" style="margin:0">${l.drillNote||"依照習作的出題方式整理，每一大題做完會顯示答對幾題。"}</p>
    ${l.drill.map((d,si)=>`<details class="drill" data-d="${si}"${si===0?" open":""}><summary>${d.title}${n(d)?`<span class="dscore" data-n="${n(d)}">（共 ${n(d)} 題）</span>`:""}</summary>${d.hint?`<p class="hint" style="margin:0">${d.hint}</p>`:""}<div class="dbody">${body(d,si)}</div></details>`).join("")}</div>`;
}
function bindDrill(root,l){
  root.querySelectorAll("details.drill").forEach(sec=>{
    const d=l.drill[+sec.dataset.d],score={ok:0,done:0},sc=sec.querySelector(".dscore");
    const tally=ok=>{score.done++;if(ok)score.ok++;if(sc){const N=+sc.dataset.n;sc.textContent=score.done>=N?`（答對 ${score.ok} / ${N}）`:`（已作答 ${score.done} / ${N}）`;sc.classList.toggle("done",score.done>=N)}};
    const res=(el,ok,msg)=>{rec("d"+sec.dataset.d+"_"+el.dataset.j,ok);const r=el.querySelector(".fres");r.hidden=false;r.innerHTML=ok?`<b class="ok">答對了！</b>${msg||""}`:`<b class="no">答錯了。</b>${msg||""}`};
    const pickOnce=(el,btns,isOk,msg)=>btns.forEach(b=>b.addEventListener("click",()=>{if(el.dataset.done)return;el.dataset.done=1;const ok=isOk(b);
      btns.forEach(x=>{x.disabled=true});b.classList.add(ok?"on":"bad");if(!ok){const good=[...btns].find(isOk);if(good)good.classList.add("on")}res(el,ok,msg(ok));tally(ok)}));
    if(d.type==="yin")sec.querySelectorAll(".di").forEach(el=>{const it=d.items[+el.dataset.j],ex=it.e||"";
      if(it.o)pickOnce(el,el.querySelectorAll(".chip"),b=>it.o[+b.dataset.v]===it.a,ok=>ok?ex:`正確答案是「${it.a}」。${ex}`);
      else{const inp=el.querySelector("input"),go=()=>{if(el.dataset.done||!inp.value.trim())return;el.dataset.done=1;const ok=it.a.some(a=>norm(a)===norm(inp.value));
        inp.classList.toggle("ok",ok);inp.classList.toggle("no",!ok);inp.readOnly=true;res(el,ok,ok?ex:`正確答案是「${it.a[0]}」。${ex}`);tally(ok)};
        el.querySelector(".chk").addEventListener("click",go);inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)go()})}});
    if(d.type==="tf")sec.querySelectorAll(".di").forEach(el=>{const it=d.items[+el.dataset.j];pickOnce(el,el.querySelectorAll(".chip"),b=>(b.dataset.v==="1")===it.a,ok=>it.e?it.e:(it.a?"這句話是對的。":""))});
    if(d.type==="syn")sec.querySelectorAll(".di").forEach(el=>{const it=d.items[+el.dataset.j];pickOnce(el,el.querySelectorAll(".chip"),b=>(b.dataset.v==="1")===it[2],ok=>`「${it[0]}」和「${it[1]}」的意思${it[2]?"相似":"不同"}。`)});
    if(d.type==="cloze")sec.querySelectorAll(".di").forEach(el=>{const it=d.items[+el.dataset.j];pickOnce(el,el.querySelectorAll(".chip"),b=>b.dataset.c===it.a,ok=>{el.querySelector(".blank").textContent=it.a;return ok?"":`正確答案是「${it.a}」。`})});
    if(d.type==="sense")sec.querySelectorAll(".di").forEach(el=>{const it=d.items[+el.dataset.j];pickOnce(el,el.querySelectorAll(".chip"),b=>+b.dataset.v===it.a,ok=>ok?"":`這裡的「${d.word}」是「${d.defs[it.a]}」的意思。`)});
    if(d.type==="comp")sec.querySelectorAll(".cgroup").forEach(cg=>{const g=d.groups[+cg.dataset.g];
      cg.querySelector(".cparts .chk").addEventListener("click",()=>cg.querySelectorAll(".cpart input").forEach(inp=>{const ok=norm(inp.value)===inp.dataset.a;inp.classList.toggle("ok",ok);inp.classList.toggle("no",!ok);if(!ok&&inp.value)inp.title=`答案：${inp.dataset.a}`;if(!ok)inp.placeholder=inp.dataset.a}));
      cg.querySelectorAll(".di").forEach(el=>{const j=+el.dataset.j.split("_")[1],ans=g.sents[j][1];
        pickOnce(el,el.querySelectorAll(".chip"),b=>b.dataset.c===ans,ok=>{el.querySelector(".blank").textContent=ans;return ok?`「${g.sents[j][0].replace("＿",ans)}」`:`正確答案是「${ans}」：${g.sents[j][0].replace("＿",ans)}。`})})});
    if(d.type==="fix")sec.querySelectorAll(".di").forEach(el=>{const it=d.items[+el.dataset.j],row=el.querySelector(".frow"),inp=row.querySelector("input");
      el.querySelectorAll(".fc").forEach(b=>b.addEventListener("click",()=>{if(el.dataset.found)return;
        if(b.textContent===it.w){el.dataset.found=1;b.classList.add("bad");row.hidden=false;row.querySelector(".fw").textContent=it.w;inp.focus()}
        else{b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");el.dataset.miss=(+(el.dataset.miss||0))+1;
          if(+el.dataset.miss>=3){const w=[...el.querySelectorAll(".fc")].find(x=>x.textContent===it.w);if(w)w.classList.add("hintc")}}}));
      const go=()=>{if(el.dataset.done||!inp.value.trim())return;el.dataset.done=1;const ok=norm(inp.value)===it.r&&!el.dataset.miss;
        const right=norm(inp.value)===it.r;inp.classList.toggle("ok",right);inp.classList.toggle("no",!right);inp.readOnly=true;
        res(el,ok,`「${it.w}」應改為「${it.r}」：${it.s.replace(it.w,it.r)}${right&&!ok?"（第一次沒找到錯字，這題不計分）":""}`);tally(ok)};
      row.querySelector(".chk").addEventListener("click",go);inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)go()})});
    if(d.type==="cls")sec.querySelectorAll(".di").forEach(el=>{const it=d.items[+el.dataset.j];pickOnce(el,el.querySelectorAll(".chip"),b=>+b.dataset.v===it.a,ok=>(ok?"":`答案是「${d.labels[it.a]}」。`)+(it.e||""))});
    if(d.type==="mc")sec.querySelectorAll(".di").forEach(el=>{const it=d.items[+el.dataset.j];pickOnce(el,el.querySelectorAll(".chip"),b=>+b.dataset.v===it.a,ok=>it.e||"")});
    if(d.type==="num")sec.querySelectorAll(".di").forEach(el=>{const it=d.items[+el.dataset.j],ins=[...el.querySelectorAll(".nb")],show=el.querySelector(".show");
      const fix=v=>norm(v).replace(/[＋]/g,"+").replace(/\s/g,"");
      const go=()=>{if(el.dataset.done||ins.some(x=>!x.value.trim()))return;el.dataset.done=1;let ok=true;
        ins.forEach((x,b)=>{const g=it.a[b].some(a=>fix(a)===fix(x.value));x.classList.toggle("ok",g);x.classList.toggle("no",!g);x.readOnly=true;if(!g)ok=false});
        res(el,ok,ok?it.e:`正確答案：${it.a.map(a=>a[0]).join("、")}。${it.e}`);tally(ok)};
      el.querySelector(".chk").addEventListener("click",go);ins.forEach(x=>x.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)go()}));
      ins.forEach(x=>x.addEventListener("input",()=>{show.hidden=false}));show.addEventListener("click",()=>{const r=el.querySelector(".fres");r.hidden=false;r.innerHTML=`<b>解法：</b>${it.e}`;show.hidden=true})});
    if(d.type==="make")sec.querySelectorAll(".di").forEach(el=>{const it=d.items[+el.dataset.j];el.querySelector(".chk").addEventListener("click",()=>{const r=el.querySelector(".fres");r.hidden=false;r.innerHTML=`<b>參考例句：</b><br>${it.ex.map(x=>"・"+x).join("<br>")}`})});
  });
}

}

const DEFAULT_EXAM={name:"六上期末考（1/12–1/13）",date:"2027-01-12"};
const exam=()=>store.get("exam_v2",DEFAULT_EXAM);
function daysLeft(){const e=new Date(exam().date+"T00:00:00");return Math.round((e-today())/864e5)}
function buildPlan(){
  const d=daysLeft();if(d<=0)return [];
  const queue=[];const keys=Object.keys(SUBJECTS);const max=Math.max(...keys.map(k=>LESSONS[k].length));
  for(let i=0;i<max;i++)keys.forEach(k=>{if(LESSONS[k][i])queue.push({k,i})});
  const studyDays=d>2?d-2:d;const per=2;let c=0;
  const plan=[];
  for(let n=0;n<d;n++){
    const day=new Date(today());day.setDate(day.getDate()+n);
    if(n>=studyDays){plan.push({day,items:[{label:n===d-1?"考前一天：錯題本＋每科重點速讀":"總複習：五科各做一回模擬題"}]});continue}
    const items=[];
    for(let j=0;j<per;j++){const x=queue[c%queue.length];const round=Math.floor(c/queue.length)+1;c++;
      items.push({k:x.k,label:`${SUBJECTS[x.k].name}｜${LESSONS[x.k][x.i].t}${round>1?`（第 ${round} 輪）`:""}`})}
    plan.push({day,items});
  }
  return plan.filter(p=>p.items.length);
}

  const pool=questionPool();const t=today();const seed=t.getFullYear()*400+t.getMonth()*32+t.getDate();
  return pool[seed%pool.length];

  Object.assign(S2,{note:"課本 P.76–83（活動 2：2-1 河流的地形、2-2 河川曲流、2-3 海岸地形、生活中的科學）。",
    points:[
      "地表長時間受到流水的<b>侵蝕、搬運和堆積</b>作用，會形成不同的地形景觀；河流的<b>上游、中游、下游</b>地形特徵各不相同。",
      "<b>上游</b>：地勢陡峭、水流湍急、河道狹窄；流水作用以「<b>侵蝕</b>」為主，也有搬運。常見景觀：<b>V 字谷、瀑布</b>、河邊是<b>大石頭</b>。（例：大漢溪上游）",
      "<b>中游</b>：地勢漸低、水流變緩、河道開始彎曲；<b>搬運作用明顯</b>，有侵蝕也有堆積。常見景觀：河道彎曲（<b>曲流</b>）、河邊是<b>鵝卵石</b>。",
      "<b>下游</b>：地勢平緩、水流緩慢、河面寬廣；流水作用以「<b>堆積</b>」為主。常見景觀：<b>泥沙淤積、河口是三角洲</b>。（例：淡水河下游）",

      "岩石礦物的應用：<b>石墨</b>黑、硬度小 → 鉛筆筆心；<b>石英</b>良好結晶稱為<b>水晶</b> → 飾品；<b>板岩</b>容易堆疊且堅硬 → 原住民族<b>石板屋</b>；<b>石灰岩</b>（方解石）→ <b>水泥</b>；<b>花崗岩</b>硬度約 7 → 牆壁、地板；<b>硫磺</b>容易燃燒 → <b>火藥</b>。",
      "<b>風化作用</b>：暴露在空氣中的岩石，長期受到陽光、空氣、水、生物活動或氣候冷熱變化等影響，由堅硬變成鬆散、碎裂，是破壞岩石的一種作用（洋蔥狀剝落、鉛筆狀剝落、粉碎成小石塊）。",
      "<b>土壤</b>是岩石經過風化作用後變成碎屑，和生物遺體腐化分解後的物質混合，經過長時間形成。地表是由岩石和土壤組成；植物由根吸收土壤裡的礦物質，動物也間接攝取，要<b>珍惜土壤資源</b>。",

  Object.assign(L3,{note:"課本 P.70–75。",
    points:[
      "隨著科技進步，<b>生物科技</b>的研究與應用有重要發展：科學家將生物科技運用在<b>食品基因改造</b>、<b>疫苗研發</b>與<b>生物複製</b>等領域。當科技能改變生命、甚至複製生命時，會對生活帶來影響。",
      "在農業方面，農民運用生物科技<b>減少化學肥料的使用</b>，降低對環境的影響，也讓蔬果更香甜可口，<b>提升農產品的產量與品質</b>。",
      "為什麼要基因改造？<b>過去</b>農民常噴灑農藥抵抗病蟲害、維持產量，但可能產生<b>農藥殘留</b>；<b>現在</b>科學家透過基因改造技術，讓作物具備<b>抗病蟲害</b>的特性，減少農藥使用、穩定生產。<b>玉米、黃豆</b>是常見的基因改造作物。",
      "基因改造引發<b>食安疑慮</b>：有些基改農產品引發對人體健康的疑慮。常見標示為基改的食品如<b>豆腐、玉米罐頭</b>等，原料可能來自基改農產品；民間團體曾走上街頭，要求政府重視。",
      "為了<b>保障消費者權益</b>，政府制定相關法規、進行<b>食品安全檢驗與管理</b>，並規定<b>基因改造食品必須清楚標示</b>，讓民眾選購時獲得完整資訊；民眾購買前也會<b>確認食品標示</b>、閱讀相關新聞。",
      "把關<b>疫苗安全</b>：生物科技應用在醫療，尤其是疫苗與藥物研發。接種疫苗有助於<b>提升免疫力、降低感染風險</b>；但疫苗正式使用前，必須經過<b>長時間的試驗與審查</b>，確保安全與效果。",
      "政府規定疫苗須經<b>主管機關許可</b>才能製造或販售；施打對象、適用年齡、接種劑量及可能的<b>副作用</b>都必須清楚公告。我們可以和家人討論、依身體狀況決定是否施打，並<b>尊重他人的選擇</b>，落實<b>健康自主管理</b>。",
      "<b>生物複製</b>：科學家嘗試複製<b>瀕臨絕種的動物</b>協助物種保育（例如美國的<b>黑足雪貂</b>曾經僅存 18 隻，經過復育增加到約 650 隻，科學家也嘗試用複製技術協助保育）；也有公司提供<b>複製寵物</b>的服務。",
      "生物複製的<b>兩難</b>：複製失敗或出現健康問題，風險由誰承擔？生命會不會變成可以被挑選、甚至量產的商品？政府必須<b>即時更新法令規範</b>，社會大眾也應思考<b>生命的價值</b>，做出負責的選擇。"],

  Object.assign(L[i2],{g:G,t:"4-2 民主社會是如何運作與維繫",note:"課本 P.86–97（第 2 課，配合習作第四單元② 22～23 頁）。",
    points:[
      "<b>憲法是民主社會的基石</b>：憲法是國家的<b>根本大法</b>，是各種法律的依據。<b>中華民國憲法</b>明確規範人民的<b>基本權利與義務</b>，以及各級政府的<b>組織與職權</b>；政府依憲法行使權力，人民以<b>選舉、表達意見</b>等方式參與公共事務並<b>監督政府施政</b>。",
      "憲法<b>第二章</b>是「人民之權利義務」。第七條：人民無分男女、宗教、種族、階級、黨派，<b>在法律上一律平等</b>；第八條身體自由；第九條除現役軍人外不受軍事審判；第十條<b>居住及遷徙</b>自由；第十一條<b>言論、講學、著作及出版</b>自由。",
      "<b>落實平等的學習與生活（平等權）</b>：學校依不同需求提供協助，例如教育部推動「<b>華語補救教學</b>」協助新住民學生、為行動不便的學生建置<b>無障礙設施</b>，落實<b>平等與尊重差異</b>。",
      "<b>保障自由</b>：人民可以自由選擇居住地方、信仰宗教、表達想法、通訊、集會等。但<b>自由不是想做什麼就做什麼</b>：以<b>不侵犯他人、不違背社會公共利益</b>為原則，不能散播不實內容或傷害他人（言論不能用來暴力、誹謗、侮辱他人）；宗教活動不可造成噪音、環境汙染等困擾。",
      "<b>參政權</b>：憲法保障人民有<b>選舉、罷免、參加公務人員考試（應考試）、擔任公職（服公職）</b>等權利。罷免：對不適任的地方首長與民選代表，罷免通過後結束其職務；擔任我國公職需具備<b>我國國籍</b>。",
      "<b>人民的義務</b>：憲法規定人民應盡<b>接受國民教育、服兵役、納稅</b>的義務。行使權利不能妨害社會秩序，必要時國家可依法加以限制。",
      "<b>接受國民教育</b>既是<b>權利也是義務</b>；<b>服兵役</b>：男性年滿<b>十八歲</b>後依法須服兵役，女性可依個人意願選擇是否當兵；<b>納稅</b>：工作收入、擁有汽車房屋要繳稅，商家開<b>統一發票</b>是向政府繳稅的證明。稅金用來興建學校、公園、大眾運輸等。",
      "<b>中央與地方的分工合作</b>：中央政府包含<b>總統府及五院</b>（行政院、立法院、司法院、考試院、監察院），處理全國性事務；地方政府由<b>縣市長</b>領導，執行中央政策並依在地需求推動建設。中央與地方也都有民意代表組成的<b>立法機關</b>，制定法規、監督施政。",
      "案例「<b>維護行人路權</b>」（每年約 400 名行人因交通事故死亡）：<b>行政院</b>提出「行人優先交通安全」政策；<b>立法院</b>通過相關法規；<b>司法院</b>所屬法院依法審判；<b>地方政府</b>設置行人優先區；<b>縣市議會</b>監督執行。",
      "<b>人民參與促進民主運作</b>：政策形成前可提出建議或修正意見；實施時可監督、透過<b>集會遊行</b>或民意代表等合法管道反映意見。<b>議題看社會・酒駕</b>：民國 108 年提高酒駕罰則（汽車最高 12 萬、拒測 18 萬、同車乘客最高 3 千），但仍難抑制（109 年 8,893 件 → 113 年 7,199 件），所以還需要<b>宣導與稽查</b>。",

  points:[
    "本文改寫自義大利作家<b>亞米契斯</b>的《<b>愛的教育</b>》。全書以十歲男孩<b>恩利科</b>的視角，用日記記錄生活見聞；〈少年筆耕〉是恩利科記下老師說的故事，被翻譯成一百多種語言、暢銷全世界。",
    "亞米契斯（西元 1846～1908 年）是義大利著名兒童文學家：1870 年以前作品多寫<b>軍旅生活</b>（如《戰地生活》），1870 年以後從事<b>教育工作</b>，代表作有《愛的教育》《一個教師的故事》等。",
    "起因：敘里奧十二歲，爸爸是鐵路局員工，家裡人口多、<b>生活拮据</b>。爸爸兼職替雜誌社<b>抄寫訂單</b>（每五百張賺三個銅幣），卻年事已高、不堪疲累。",
    "<b>觀點大不同</b>：爸爸認為「孩子的學業比訂單更重要」；敘里奧認為「我已經長大了，當然要為家裡出一分力」。同一事件，<b>立場不同，觀點也不同</b>。",
    "經過：敘里奧夜裡<b>躡手躡腳</b>走進書房，<b>模仿爸爸的筆跡</b>偷偷抄寫，心裡<b>既歡喜又有些恐懼</b>；爸爸以為自己「還沒老呢」，十分高興。",
    "誤會加深：敘里奧白天沒精神、打瞌睡，爸爸責備他「<b>和從前判若兩人</b>」。為了<b>助爸爸一臂之力</b>，他把真相吞回去，<b>不做辯解</b>，內心十分煎熬。",

function speakEN(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;const v=speechSynthesis.getVoices().find(x=>/^en(-|_)US/i.test(x.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function bindVocab(p){p.querySelectorAll(".vw").forEach(b=>b.addEventListener("click",()=>{speakEN(b.dataset.w);b.classList.add("said");setTimeout(()=>b.classList.remove("said"),600)}));

const MOE="https://stroke-order.learningweb.moe.edu.tw/";
let chList=[],chIdx=0,stkK=0,stkTimer=null,lastFocus=null,uid=0;
function strokeData(ch){const d=STROKES[ch],i=CHINFO[ch];if(!d)return null;if(i&&i.n!==d.s.length)return null;return d}
function drawStrokes(ch,k,anim){
  const d=strokeData(ch);const box=$("#stk");
  const grid=`<rect x="8" y="8" width="1008" height="1008" class="gl" style="stroke-dasharray:none;stroke-width:0"/><line class="gl" x1="512" y1="0" x2="512" y2="1024"/><line class="gl" x1="0" y1="512" x2="1024" y2="512"/>`;
  if(!d){box.innerHTML=`<svg viewBox="0 0 1024 1024" role="img" aria-label="${ch}">${grid}<text x="512" y="520" text-anchor="middle" dominant-baseline="middle" font-size="760" class="sd" font-family="var(--body)">${ch}</text></svg>`;return}
  const tf=d.src==="hw"?' transform="translate(0,900) scale(1,-1)"':"";const id="c"+(++uid);
  let s="";
  d.s.forEach((o,i)=>{
    if(i<k-1||(i===k-1&&!anim))s+=`<path class="${i===k-1?'sc':'sd'}" d="${o}"/>`;
    else s+=`<path class="so" d="${o}"/>`;
  });
  if(anim&&k>0){const i=k-1;s+=`<clipPath id="${id}"><path d="${d.s[i]}"/></clipPath><path class="sm" clip-path="url(#${id})" pathLength="1000" d="${d.m[i]}"/>`}
  box.innerHTML=`<svg viewBox="0 0 1024 1024" role="img" aria-label="${ch}的筆順，第 ${k} 畫">${grid}<g${tf}>${s}</g></svg>`;
}
function stopPlay(){clearTimeout(stkTimer);stkTimer=null;$("#stkPlay").textContent="▶ 播放筆順"}
function setK(k,anim){const d=strokeData(chList[chIdx][0]);const n=d?d.s.length:0;stkK=Math.max(0,Math.min(n,k));drawStrokes(chList[chIdx][0],stkK,anim);$("#stkCnt").textContent=stkK?`第 ${stkK} / ${n} 畫`:`共 ${n} 畫`}
function play(){
  const d=strokeData(chList[chIdx][0]);if(!d)return;
  if(stkTimer){stopPlay();return}
  $("#stkPlay").textContent="❚❚ 暫停";if(stkK>=d.s.length)stkK=0;
  const step=()=>{setK(stkK+1,true);if(stkK<d.s.length)stkTimer=setTimeout(step,750);else{stkTimer=setTimeout(()=>{stopPlay();setK(stkK,false)},700)}};
  step();
}

function labCanvas(root,LH,draw){const c=mk(root,"canvas","labcv",null),ctx=c.getContext("2d"),o={c,ctx};
  const fit=()=>{const w=Math.max(280,Math.min(760,root.clientWidth||600)),h=Math.round(w*LH/600),d=Math.min(2,window.devicePixelRatio||1);
    c.width=Math.round(w*d);c.height=Math.round(h*d);c.style.width=w+"px";c.style.height=h+"px";ctx.setTransform(d*w/600,0,0,d*w/600,0,0);if(draw&&o.ready)draw()};
  fit();o.ready=true;const ro=new ResizeObserver(fit);ro.observe(root);o.stop=()=>ro.disconnect();
  o.pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*LH/r.height]};return o}

const dist2=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const plen=p=>p.slice(1).reduce((s,q,i)=>s+dist2(q,p[i]),0);
function medPts(d,i){const n=d.m[i].match(/-?\d+(\.\d+)?/g).map(Number),pts=[];for(let j=0;j+1<n.length;j+=2)pts.push([n[j],d.src==="hw"?900-n[j+1]:n[j+1]]);return pts}
function segD(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;let t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function avgD(u,m){let s=0;u.forEach(p=>{let b=1e9;for(let i=0;i<m.length-1;i++)b=Math.min(b,segD(p,m[i],m[i+1]));if(m.length===1)b=dist2(p,m[0]);s+=b});return s/u.length}
function strokeOK(u,m){
  if(u.length<2)return false;const ml=plen(m),ul=plen(u),tol=ml<160?200:180;
  if(dist2(u[0],m[0])>tol||dist2(u[u.length-1],m[m.length-1])>tol)return false;
  if(ul<Math.max(35,ml*.35))return false;
  if(ml>40&&dist2(u[0],m[0])>dist2(u[0],m[m.length-1]))return false;
  if(ml>40){const a=[u[u.length-1][0]-u[0][0],u[u.length-1][1]-u[0][1]],b=[m[m.length-1][0]-m[0][0],m[m.length-1][1]-m[0][1]];
    if((a[0]*b[0]+a[1]*b[1])/((Math.hypot(...a)*Math.hypot(...b))||1)<.4)return false}
  return avgD(u,m)<140}

/* ===== 題目索引：把每一題（選擇、填空、各種題型練習）變成可以單獨取出、單獨重做的「題目參照」 ===== */
const QREF=(()=>{
  const strip=s=>String(s==null?"":s).replace(/<[^>]+>/g,"");
  const tgt=s=>String(s).replace(/\{([^}]+)\}/g,'<span class="tgt">$1</span>');
  const KIND={q:"選擇題",f:"填空題",yin:"字音字形",tf:"是非題",syn:"近義詞",comp:"部件組字",fix:"改錯字",cloze:"選詞填寫",sense:"一字多義",cls:"分類判斷",mc:"選擇題",num:"計算填充"};
  /* 一課裡所有可以自動批改的題目 id（和 rec() 用的 id 完全相同） */
  function ids(l){const out=[];if(!l)return out;
    (l.qs||[]).forEach((_,j)=>out.push("q"+j));
    (l.fill||[]).forEach((_,j)=>out.push("f"+j));
    (l.drill||[]).forEach((d,si)=>{
      if(d.type==="make")return;
      if(d.type==="comp")d.groups.forEach((g,gi)=>g.sents.forEach((_,j)=>out.push(`d${si}_${gi}_${j}`)));
      else d.items.forEach((_,j)=>out.push(`d${si}_${j}`))});
    return out}
  /* 取出一題：回傳 {kind,label,stem,answer,expl,lesson:{qs|fill|drill}}，lesson 是只含這一題的迷你課，可直接丟給原本的出題程式 */
  function get(lessonId,qid){
    const l=lessonOf(lessonId);if(!l)return null;const [k]=String(lessonId).split(":");
    const base={id:lessonId+"|"+qid,lessonId,qid,subj:k,lessonT:l.t,lessonN:l.n};
    const dep=(stem,prev)=>/^(接上題|同上|承上)/.test(strip(stem))&&prev?{prevStem:strip(prev)}:{};
    if(qid[0]==="q"){const q=(l.qs||[])[+qid.slice(1)];if(!q)return null;
      return {...base,...dep(q.q,+qid.slice(1)>0&&l.qs[+qid.slice(1)-1].q),kind:"q",label:KIND.q,stem:q.q,answer:q.o[q.a],expl:q.e||"",mini:{qs:[q]},localId:"q0",choice:true}}
    if(qid[0]==="f"){const f=(l.fill||[])[+qid.slice(1)];if(!f)return null;

/* ---- 雲端同步：登入 Claude 而且有寫入權限的人，進度會跟著帳號走；其他人照常存在這台裝置 ---- */
const CLOUD=(()=>{
  let ref=null,state="local",timer=0,busy=false,again=false,lastSync=0;const subs=[];
  const emit=()=>subs.forEach(f=>{try{f()}catch(e){}});
  const pack=()=>{const data={};SYNC_KEYS.forEach(k=>{const v=store.get(k,null);if(v!=null)data[k]=v});return {v:1,ts:(store.get(META_KEY,{ts:0}).ts)||Date.now(),json:JSON.stringify(data)}};
  async function push(){if(!ref||state==="off")return;if(busy){again=true;return}busy=true;state="saving";emit();
    try{await ref.set(pack());lastSync=Date.now();state="synced"}
    catch(e){const c=e&&e.code;if(c==="unavailable"||c==="resource_exhausted"){state="retry";clearTimeout(timer);timer=setTimeout(push,30000)}else{state="off";ref=null}}
    busy=false;emit();if(again){again=false;dirty()}}
  function dirty(){if(!ref||state==="off")return;clearTimeout(timer);timer=setTimeout(push,4000)}
  /* 合併：以較新的那份為主，再把另一份裡「對方沒有的作答和錯題」補進來，兩台裝置各做一半也不會互相蓋掉 */
  function merge(remote){const localTs=store.get(META_KEY,{ts:0}).ts||0;let rd;try{rd=JSON.parse(remote.json)}catch(e){return false}
    const lp=store.get(PKEY,{}),rp=rd[PKEY]||{},remoteNewer=(remote.ts||0)>localTs;
    const hasLocal=Object.keys(lp).length>0;
    if(!remoteNewer&&hasLocal){const mp=JSON.parse(JSON.stringify(lp));let added=false;for(const id in rp){mp[id]=mp[id]||{};for(const q in rp[id])if(!(q in mp[id])){mp[id][q]=rp[id][q];added=true}}
      if(added){store.set(PKEY,mp);Object.assign(PMEM,mp)}return added}
    const mp=JSON.parse(JSON.stringify(rp));for(const id in lp){mp[id]=mp[id]||{};for(const q in lp[id])if(!(q in mp[id]))mp[id][q]=lp[id][q]}
    rd[PKEY]=mp;const lm=store.get(MIST_KEY,null);if(lm&&rd[MIST_KEY]){for(const k in lm.items)if(!(k in rd[MIST_KEY].items))rd[MIST_KEY].items[k]=lm.items[k]}
    const la=store.get(ACT_KEY,null);if(la){rd[ACT_KEY]=rd[ACT_KEY]||{};for(const d in la)if(!rd[ACT_KEY][d]||(la[d].n||0)>(rd[ACT_KEY][d].n||0))rd[ACT_KEY][d]=la[d]}
    applyData(rd);try{localStorage.setItem(META_KEY,JSON.stringify({ts:remote.ts}))}catch(e){}return true}
  async function init(onChange){
    try{if(!window.claude||!window.claude.use)return;
      const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);if(!db||!user)return;
      const id=await user.id();if(!id)return;
      const can=await user.can("data.write");if(can===false)return;
      ref=db.collection("data/users/"+id).doc("save");
      const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000))]);
      let changed=false;if(snap&&snap.exists){const d=snap.data();if(d&&d.json)changed=merge(d)}
      state="synced";lastSync=Date.now();emit();if(changed&&onChange)onChange();
      if(Object.keys(store.get(PKEY,{})).length||AV_SAVED())push();
    }catch(e){ref=null;state="local";emit()}}
  return {init,dirty,push,on:f=>subs.push(f),get state(){return state},get lastSync(){return lastSync}};
})();

/* 視窗：開關、背景點擊關閉、Esc、Tab 鍵留在視窗內、關掉後焦點回到原本的按鈕 */
const OV={stack:[],
  open(id,opt={}){const el=$("#"+id);if(!el.hidden)return;el.hidden=false;OV.stack.push({el,from:document.activeElement,onClose:opt.onClose});
    const f=opt.focus?el.querySelector(opt.focus):el.querySelector("button,input,[tabindex]");if(f)f.focus()},
  close(id){const i=OV.stack.findIndex(x=>x.el.id===id);if(i<0){$("#"+id).hidden=true;return}const [x]=OV.stack.splice(i,1);x.el.hidden=true;if(x.onClose)x.onClose();if(x.from&&x.from.focus&&document.contains(x.from))x.from.focus()},
  top(){const all=[...document.querySelectorAll(".ov:not([hidden])")];return all[all.length-1]||null}};
document.addEventListener("keydown",e=>{const top=OV.top();if(!top)return;
  if(e.key==="Escape"){const reg=OV.stack.find(x=>x.el===top);if(reg&&!top.dataset.noesc){e.preventDefault();OV.close(top.id)}return}
  if(e.key!=="Tab")return;const fs=[...top.querySelectorAll("button,input,select,textarea,a[href],[tabindex]:not([tabindex='-1'])")].filter(x=>!x.disabled&&x.offsetParent!==null);if(!fs.length)return;
  const a=fs[0],b=fs[fs.length-1];if(!top.contains(document.activeElement)){e.preventDefault();a.focus()}else if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}});

/* 這些題目離開原本的頁面就看不懂（接續上一題、需要對照圖），不放進隨機出題 */
const STANDALONE=r=>{const s=QREF.strip(r.stem);return !/^(接上題|同上|承上)/.test(s)&&!/上(一)?題|如圖|右圖|下圖|上圖|圖中|甲側|乙側/.test(s)&&r.kind!=="fix"};
/* 選題：優先沒做過和答錯的，並且平均分給各課 */
function pickQs(subj,n){
  const by={};QREF.all().filter(x=>!subj||x.subj===subj).forEach(x=>{(by[x.lessonId]=by[x.lessonId]||[]).push(x)});
  const lessons=shuffle(Object.keys(by)),out=[];const score=x=>{const r=lastResult(x.lessonId,x.qid);return (r===null?0:r===0?1:3)+Math.random()*1.5};
  const pools=lessons.map(id=>by[id].map(x=>({x,s:score(x)})).sort((a,b)=>a.s-b.s).map(o=>o.x));
  let guard=0;while(out.length<n&&guard++<5000){let any=false;for(const p of pools){if(out.length>=n)break;while(p.length){const x=p.shift(),r=QREF.get(x.lessonId,x.qid);if(r&&STANDALONE(r)){out.push(r);any=true;break}}}if(!any)break}
  return shuffle(out)}

function smartPlan(){const d=daysLeft();if(d<=0)return [];const keys=Object.keys(SUBJECTS),max=Math.max(...keys.map(k=>LESSONS[k].length));
  let queue=[];for(let i=0;i<max;i++)keys.forEach(k=>{if(LESSONS[k][i])queue.push({k,i})});
  const todo=queue.filter(x=>lessonStats(x.k+":"+x.i).stars<3);const first=todo.length?todo:queue;
  const studyDays=d>2?d-2:d,plan=[];let c=0;
  for(let n=0;n<d;n++){const day=new Date(today());day.setDate(day.getDate()+n);
    if(n>=studyDays){plan.push({day,items:[{label:n===d-1?"考前一天：清空錯題本＋每科重點速讀":"總複習：五科各考一回模擬考"}]});continue}
    const items=[];for(let j=0;j<2;j++){const src=c<first.length?first:queue,x=src[c<first.length?c:(c-first.length)%queue.length];c++;items.push({k:x.k,id:x.k+":"+x.i,label:LESSONS[x.k][x.i].t})}
    plan.push({day,items})}
  return plan}

const pieceSVG=(p,cls="")=>`<svg viewBox="${p.box.join(" ")}" class="${cls}">${GP(0,p.svg)}</svg>`;
const figSVG=(set,got)=>`<svg viewBox="${set.fvb}" class="digfig" role="img" aria-label="${set.title}：已找到 ${got.length} / ${set.pieces.length} 塊">${set.pieces.map(p=>got.includes(p.id)?`<g class="pg on">${GP(0,p.svg)}</g>`:`<g class="pg off"><rect x="${p.box[0]+8}" y="${p.box[1]+8}" width="${p.box[2]-16}" height="${p.box[3]-16}" rx="8"/><text x="${p.box[0]+p.box[2]/2}" y="${p.box[1]+p.box[3]/2+5}" text-anchor="middle">?</text></g>`).join("")}</svg>`;

/* 從這一課的題目做出挖掘用的題庫 */
function gameQs(l){const out=[];
  (l.qs||[]).forEach(q=>out.push({q:q.q,o:q.o,a:q.a,e:q.e}));
  (l.drill||[]).forEach(d=>(d.items||[]).forEach(it=>{
    if(d.type==="mc")out.push({q:it.s,o:it.o,a:it.a,e:it.e});
    else if(d.type==="tf")out.push({q:it.s+"（True or False?）",o:["True","False"],a:it.a?0:1,e:it.e});
    else if(d.type==="cls"&&d.labels.length<=4)out.push({q:`「${it.s}」屬於哪一類？`,o:d.labels,a:it.a,e:it.e})}));
  const V=l.vocab||[];V.forEach((v,i)=>{const others=shuffle(V.filter((_,j)=>j!==i)).slice(0,3);
    out.push({q:`「${v[1]}」的英文是哪一個？`,o:[v[0],...others.map(x=>x[0])],a:0,e:`${v[0]}＝${v[1]}`,say:v[0]});
    out.push({q:`<span lang="en">${v[0]}</span> 是什麼意思？`,o:[v[1],...others.map(x=>x[1])],a:0,e:`${v[0]}＝${v[1]}`,say:v[0]})});
  return out}
const shuffleQ=q=>{const idx=shuffle(q.o.map((_,i)=>i));return {...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}};

function mountDig(root,k,i,l){
  const id=k+":"+i,set=DIG_SETS[l.game.dig],N=16;let G=gameLoad(),S=(G[id]=G[id]||{}).dig;
  const newBoard=()=>{const cells=[...set.pieces.map((_,j)=>({t:"p",i:j})),...set.treasures.map((_,j)=>({t:"t",i:j}))];while(cells.length<N)cells.push({t:"e"});
    return {cells:shuffle(cells),dug:[],miss:0,det:0,combo:0,done:false,best:(S&&S.best)||0,wins:(S&&S.wins)||0}};
  if(!S||!S.cells)S=G[id].dig=newBoard();
  const save=()=>{G=gameLoad();G[id]=G[id]||{};G[id].dig=S;gameSave(G)};
  let pool=shuffle(gameQs(l)),qi=0,cur=null,sel=-1,glow=-1,busy=false;
  const nextQ=()=>{if(qi>=pool.length){pool=shuffle(pool);qi=0}return shuffleQ(pool[qi++])};
  const got=()=>S.cells.map((c,j)=>c.t==="p"&&S.dug.includes(j)?set.pieces[c.i].id:null).filter(Boolean);
  const tres=()=>S.cells.map((c,j)=>c.t==="t"&&S.dug.includes(j)?set.treasures[c.i]:null).filter(Boolean);
  const starsOf=m=>m<=2?3:m<=5?2:1;
  root.innerHTML=`<div class="box wide game"><h3 class="h3row"><span>挖掘場：${set.title}</span><span class="hint">答對才能挖，連對 3 題得到一次探測器</span></h3>
    <p class="hint" style="margin:0">${set.intro}</p>
    <div class="digwrap"><div class="digl"><div class="digboard" id="digBoard" role="grid" aria-label="挖掘場，共 ${N} 格"></div>
      <div class="digbar"><span id="digStat"></span><button type="button" id="digDet" class="fcbtn">探測器 ×<b id="digDetN">0</b></button><button type="button" id="digNew" class="ghost">重新挖一次</button></div></div>
      <div class="digr"><div class="digfigbox" id="digFig"></div><div id="digQ" class="digq" aria-live="polite"></div><div id="digFound" class="digfound"></div></div></div></div>`;
  const B=root.querySelector("#digBoard"),Q=root.querySelector("#digQ");
  function draw(){const g=got();
    B.innerHTML=S.cells.map((c,j)=>{const d=S.dug.includes(j);let inner="";
      if(d)inner=c.t==="p"?pieceSVG(set.pieces[c.i],"dgi"):c.t==="t"?set.treasures[c.i].svg:`<span class="peb" aria-hidden="true">· ·<br>·</span>`;
      const lab=d?(c.t==="p"?`第 ${j+1} 格：${set.pieces[c.i].en} ${set.pieces[c.i].zh}`:c.t==="t"?`第 ${j+1} 格：寶物 ${set.treasures[c.i].en}`:`第 ${j+1} 格：只有泥土`):`第 ${j+1} 格，還沒挖`;
      return `<button type="button" class="dt${d?" dug":""}${d&&c.t!=="e"?" find":""}${j===sel?" sel":""}${j===glow&&!d?" glow":""}" data-j="${j}" aria-label="${lab}"${d||S.done?" disabled":""}>${inner}</button>`}).join("");
    root.querySelector("#digFig").innerHTML=figSVG(set,g);
    const t=tres();root.querySelector("#digFound").innerHTML=`<b>骨架／碎片 ${g.length} / ${set.pieces.length}</b>${g.length?`<div class="dchips">${set.pieces.filter(p=>g.includes(p.id)).map(p=>`<button type="button" class="chip" data-say="${p.en}" lang="en">${p.en}<small> ${p.zh}</small></button>`).join("")}</div>`:""}
      <b>額外寶物 ${t.length} / ${set.treasures.length}</b>${t.length?`<div class="dchips">${t.map(x=>`<button type="button" class="chip" data-say="${x.en}" lang="en">${x.en}<small> ${x.zh}</small></button>`).join("")}</div>`:""}`;
    root.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",()=>speakEN(b.dataset.say)));
    root.querySelector("#digStat").innerHTML=`已挖 ${S.dug.length} / ${N} 格・失誤 ${S.miss}・連對 ${S.combo}${S.best?`・最佳 ${STARS(S.best)}`:""}`;
    root.querySelector("#digDetN").textContent=S.det;root.querySelector("#digDet").disabled=!S.det||S.done;
    B.querySelectorAll(".dt:not([disabled])").forEach(b=>b.addEventListener("click",()=>pick(+b.dataset.j)));
    if(S.done)finish(false)}
  function pick(j){if(busy)return;sel=j;cur=nextQ();draw();
    Q.innerHTML=`<p class="dq"><b>第 ${j+1} 格</b>：${cur.q}</p><div class="opts">${cur.o.map((o,x)=>`<button type="button" data-x="${x}">${String.fromCharCode(65+x)}. ${o}</button>`).join("")}</div><p class="expl" id="digE" hidden></p>`;
    Q.querySelectorAll("[data-x]").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.x,b)));
    const f=Q.querySelector("[data-x]");if(f)f.focus({preventScroll:true});Q.scrollIntoView({block:"nearest",behavior:"smooth"})}
  function answer(x,btn){if(busy||!cur)return;busy=true;const ok=x===cur.a,all=Q.querySelectorAll("[data-x]");all.forEach(b=>b.disabled=true);
    all[cur.a].classList.add("ok");if(!ok)btn.classList.add("no");const E=Q.querySelector("#digE");
    if(cur.say)speakEN(cur.say);
    if(ok){S.combo++;if(S.combo%3===0){S.det++;toast("連對 3 題！得到一次探測器。","star")}
      const j=sel,c=S.cells[j];S.dug.push(j);if(glow===j)glow=-1;
      let msg="這一格只有泥土，換一格試試。";
      if(c.t==="p"){const p=set.pieces[c.i];msg=`挖到了 <b lang="en">${p.en}</b>（${p.zh}）！`;speakEN(p.en);toast(`找到 ${p.en} ${p.zh}！`,"good")}
      else if(c.t==="t"){const t=set.treasures[c.i];msg=`意外發現寶物 <b lang="en">${t.en}</b>（${t.zh}）！`;speakEN(t.en)}
      E.innerHTML=`<b class="okc">答對了！</b>${msg}`;E.hidden=false;
      if(got().length===set.pieces.length){S.done=true;S.wins=(S.wins||0)+1;const st=starsOf(S.miss);S.best=Math.max(S.best||0,st);save();sel=-1;setTimeout(()=>{busy=false;draw();finish(true)},700);return}}
    else{S.miss++;S.combo=0;E.innerHTML=`<b class="noc">還不能挖。</b>正確答案是 ${String.fromCharCode(65+cur.a)}。${cur.e||""}<br>再選一格，換一題挑戰。`;E.hidden=false;
      const t=B.querySelector(`.dt[data-j="${sel}"]`);if(t){t.classList.add("shake");setTimeout(()=>t.classList.remove("shake"),400)}}
    save();sel=-1;cur=null;setTimeout(()=>{busy=false;draw()},ok?550:250)}
  function finish(fresh){const st=starsOf(S.miss);
    Q.innerHTML=`<div class="digwin"><div class="digcard">${figSVG(set,set.pieces.map(p=>p.id))}<b>${set.title} 完成！</b><span>${STARS(st)}　失誤 ${S.miss} 次・已完成 ${S.wins} 次</span></div>
      <div class="dwr"><p style="margin:0">把每個部位的英文念一遍：</p><div class="dchips">${set.pieces.map(p=>`<button type="button" class="chip" data-say2="${p.en}" lang="en">${p.en}<small> ${p.zh}</small></button>`).join("")}</div>
      <p class="hint" style="margin:0">失誤 0–2 次 ★★★、3–5 次 ★★、6 次以上 ★。</p><button type="button" class="pri" id="digAgain">再挖一次（新的埋藏位置）</button></div></div>`;
    Q.querySelectorAll("[data-say2]").forEach(b=>b.addEventListener("click",()=>speakEN(b.dataset.say2)));
    Q.querySelector("#digAgain").addEventListener("click",reset);
    if(fresh){try{confetti()}catch(e){}toast(`${set.title}完成！${"★".repeat(st)}`,"star")}}
  function reset(){S=newBoard();save();glow=-1;Q.innerHTML="";draw()}
  root.querySelector("#digNew").addEventListener("click",()=>{if(S.dug.length&&!S.done&&!confirm("要放棄這一場，重新埋藏嗎？"))return;reset()});

  function tap(b){if(!run)return;const si=+b.closest(".fhs").dataset.si,ci=+b.dataset.ci,it=run.rounds[run.ri][si];

function mountComp(root,k,i,l){
  const id=k+":"+i,cd=(l.drill||[]).find(d=>d.type==="comp"),groups=cd?cd.groups:[];
  const zy={};(l.words||[]).forEach(w=>zy[w[0]]=w[1]);

  let run=null;
  root.innerHTML=`<div class="box wide game">${gHead("部件組字工坊","把部件放上工作台，組出句子要的字")}<div id="cpRoot"></div></div>`;

      run.n++;setTimeout(()=>run.n<run.q.length?ask():finish(),1300)}
    else{run.miss++;run.wrong.push(q);b.disabled=true;b.classList.add("no");R.querySelector("#cpOut").textContent=hit?hit[1]:"✕";R.querySelector("#cpOut").classList.remove("ok");

      <button type="button" class="pri" id="cpRe">再組一次</button></div>`;R.querySelector("#cpRe").addEventListener("click",start)}

function mountScam(root,k,i,l){
  const id=k+":"+i;let ord=[],si=0,score=0,step=0,found=new Set(),wrongTap=0;
  root.innerHTML=`<div class="box wide game">${gHead("網路偵探：停・看・查","點出訊息裡可疑的地方，再決定怎麼做")}<div id="scRoot"></div></div>`;
  const R=root.querySelector("#scRoot");
  function intro(){const r=gRec(id,"scam");R.innerHTML=`<div class="sortintro"><p style="margin:0">你是網路偵探，手機會收到 ${SCAMS.length} 則訊息。先<b>點出可疑的句子</b>，按「我找完了」，再選出最好的做法。</p>
      <p class="hint" style="margin:0">提醒：也有完全沒問題的訊息！找到一個可疑處 +10、點錯 −5、做法選對 +20。${r.best?`最高分：<b>${r.best}</b>`:""}</p><button type="button" class="pri" id="scGo">開始調查</button></div>`;
    R.querySelector("#scGo").addEventListener("click",()=>{ord=shuffle(SCAMS);si=0;score=0;show()})}
  function show(){const c=ord[si];step=0;found=new Set();wrongTap=0;const nf=c.segs.filter(s=>s[1]).length;
    R.innerHTML=`<div class="sorthud"><span>案件 ${si+1} / ${ord.length}</span><span>分數 ${score}</span></div>
      <div class="scphone ${c.kind}"><div class="scfrom">${c.from}</div><div class="scmsg">${c.segs.map((s,j)=>`<button type="button" class="scseg" data-j="${j}">${s[0]}</button>`).join("")}</div></div>
      <div class="subact"><button type="button" class="pri" id="scDone">我找完了</button><span class="hint">點句子標記可疑；再點一次取消。</span></div><div id="scE" class="jge" aria-live="polite"></div>`;
    R.querySelectorAll(".scseg").forEach(b=>b.addEventListener("click",()=>{if(step)return;b.classList.toggle("mark")}));
    R.querySelector("#scDone").addEventListener("click",check)}
  function check(){if(step)return;step=1;const c=ord[si];let hit=0,bad=0,miss=0;
    R.querySelectorAll(".scseg").forEach(b=>{const s=c.segs[+b.dataset.j],m=b.classList.contains("mark");b.disabled=true;
      if(s[1]&&m){hit++;b.classList.add("hit");b.insertAdjacentHTML("beforeend",`<small>${s[1]}</small>`)}
      else if(s[1]&&!m){miss++;b.classList.add("missed");b.insertAdjacentHTML("beforeend",`<small>漏掉了：${s[1]}</small>`)}
      else if(!s[1]&&m){bad++;b.classList.add("over")}});
    score+=hit*10-bad*5;score=Math.max(0,score);R.querySelector("#scDone").hidden=true;
    const nf=c.segs.filter(s=>s[1]).length;
    R.querySelector("#scE").innerHTML=`<p style="margin:0">${c.safe&&!bad?`<b class="okc">沒錯，這則訊息沒有可疑的地方！</b>`:`找到 ${hit} / ${nf} 個可疑處${bad?`，${bad} 句其實沒問題`:""}${miss?`，漏掉 ${miss} 個`:""}。`}</p>
      <p style="margin:0"><b>你會怎麼做？</b></p><div class="opts">${c.acts.map((a,j)=>`<button type="button" data-a="${j}">${a}</button>`).join("")}</div><p class="expl" id="scX"></p>`;
    R.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>act(+b.dataset.a,b)))}
  function act(a,b){const c=ord[si],ok=a===c.a;R.querySelectorAll("[data-a]").forEach(x=>x.disabled=true);R.querySelectorAll("[data-a]")[c.a].classList.add("ok");if(!ok)b.classList.add("no");if(ok)score+=20;
    const X=R.querySelector("#scX");X.innerHTML=`${ok?`<b class="okc">做得好！</b>`:`<b class="noc">再想想。</b>`}${c.e}　<button type="button" class="pri" id="scNx">${si+1<ord.length?"下一則":"看結果"}</button>`;
    R.querySelector("#scNx").addEventListener("click",()=>{si++;si<ord.length?show():finish()})}
  function finish(){const b=gBest(id,"scam",score);if(b.nb){try{confetti()}catch(e){}}
    R.innerHTML=`<div class="sortend"><p class="sortsc"><b>${score}</b> 分${b.nb?`　<span class="streak">新紀錄！</span>`:`　最高 ${b.best} 分`}</p>
      <div class="coach"><b>停・看・查</b><ol><li><b>停</b>：先不點連結、不轉傳、不給個資。</li><li><b>看</b>：看來源是誰、有沒有催你、要你保密、要錢要點數。</li><li><b>查</b>：找可靠來源或問家人老師，必要時打 165 反詐騙專線。</li></ol></div>
      <button type="button" class="pri" id="scRe">再調查一次</button></div>`;R.querySelector("#scRe").addEventListener("click",()=>{ord=shuffle(SCAMS);si=0;score=0;show()})}
  intro();return ()=>{}}

function mountEnergy(root,k,i,l){

  const calc=()=>{const s={day:0,night:0,cost:0,co2:0,eco:0,dd:100,dn:70};ENERGY.forEach(e=>{const c=cnt[e.id]||0;s.cost+=c*e.cost;

      <p class="expl" id="eNote" aria-live="polite">點 ＋／− 調整，每一格代表一座發電設施或一項措施。</p><div class="subact"><button type="button" id="eReset" class="ghost">全部清空</button></div>`;

  function bar(lab,v,max,goal,good,unit=""){const p=Math.min(100,v/max*100),g=goal!=null?Math.min(100,goal/max*100):null;
    return `<div class="enbar"><span>${lab}</span><span class="entr"><i style="width:${p}%;background:${good?"var(--ok)":"var(--bad)"}"></i>${g!=null?`<em style="left:${g}%"></em>`:""}</span><b>${v}${unit}${goal!=null?` / ${goal}`:""}</b></div>`}

function reportData(){const acts=actAll(),days=Object.keys(acts).sort(),tot=days.reduce((s,d)=>({n:s.n+acts[d].n,ok:s.ok+acts[d].ok,sec:s.sec+(acts[d].sec||0)}),{n:0,ok:0,sec:0});

  const untouched=[];for(const k in SUBJECTS)LESSONS[k].forEach((l,i)=>{if(lessonTotal(l)&&!lessonStats(k+":"+i).done)untouched.push({id:k+":"+i,k,t:l.t})});
  return {tot,days:days.filter(d=>acts[d].n).length,subj,weak:weak.slice(0,6),untouched,exams:examsAll().slice(-8).reverse(),streak:streak(),mist:mistList().length,cleared:mistAll().cleared||0}}

  R.subj.forEach(s=>L.push(`${SUBJECTS[s.k].name}：答對 ${s.ok}/${s.t} 題（已作答 ${s.done} 題，答對率 ${s.done?Math.round(s.acc*100):0}%），通關 ${s.clear}/${s.n} 課`));
  if(R.weak.length)L.push("需要加強："+R.weak.map(w=>`${SUBJECTS[w.k].name} ${w.t}（${Math.round(w.acc*100)}%）`).join("、"));

    <section class="box wide"><h3>各科掌握度</h3><div class="tbl"><table class="rtable"><thead><tr><th>科目</th><th>答對／全部題數</th><th>已作答</th><th>答對率</th><th>通關小島</th></tr></thead><tbody>
      ${R.subj.map(s=>`<tr><td><i class="dot" style="background:var(${SUBJECTS[s.k].color})"></i>${SUBJECTS[s.k].name}</td><td><div class="mbar slim"><div class="mtrack"><i style="width:${s.cover*100}%;background:var(${SUBJECTS[s.k].color})"></i></div><b>${s.ok} / ${s.t}</b></div></td><td>${s.done}</td><td>${s.done?Math.round(s.acc*100)+"%":"—"}</td><td>${s.clear} / ${s.n}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="box"><h3>最需要加強的課</h3>${R.weak.length?`<ul class="wlist">${R.weak.map(w=>`<li><a class="lk" href="#${toHash(w.id)}"><i class="dot" style="background:var(${SUBJECTS[w.k].color})"></i>${esc(w.t)}</a><b>${Math.round(w.acc*100)}%</b></li>`).join("")}</ul><p class="hint" style="margin:0">作答 5 題以上、答對率不到 7 成的課。</p>`:`<p class="empty">目前沒有答對率偏低的課。${R.tot.n<20?"多做幾題之後，這裡會列出需要加強的地方。":""}</p>`}
      ${R.untouched.length?`<p class="hint" style="margin:0">還有 <b>${R.untouched.length}</b> 課沒開始：${R.untouched.slice(0,4).map(u=>`<a class="lk" href="#${toHash(u.id)}">${esc(u.t)}</a>`).join("、")}${R.untouched.length>4?" …":""}</p>`:""}</section>
    <section class="box"><h3>模擬考紀錄</h3>${R.exams.length?`<ul class="wlist">${R.exams.map(x=>`<li><span>${fmt(new Date(x.t))}　${x.subj==="all"?"五科綜合":SUBJECTS[x.subj].name}<small class="hint">　${x.ok}/${x.n} 題・${mmss(x.sec)}</small></span><b>${Math.round(x.ok/x.n*100)} 分</b></li>`).join("")}</ul>`:`<p class="empty">還沒考過模擬考。到總複習島選一科試試看。</p>`}</section>
    <section class="box wide"><h3>最近 14 天</h3><div class="wk wide14" role="img" aria-label="最近十四天每天作答題數">${days.map(w=>`<div class="wkc"><span class="wkn">${w.n||""}</span><div class="wkb"><i style="height:${w.n/mx*100}%"></i><b style="height:${w.ok/mx*100}%"></b></div><span class="wkd">${w.d.getDate()}</span></div>`).join("")}</div></section>
    <section class="box wide"><h3>給爸媽的文字報告</h3><textarea id="rtext" class="rtext" readonly rows="9">${esc(reportText(R))}</textarea><div class="subact"><button type="button" class="pri" id="rcopy">複製文字</button><span class="hint">貼到 LINE 或訊息裡傳給爸媽。</span></div></section>
  </div>`;
  $("#back").addEventListener("click",()=>go("hub",{top:true}));
  $("#rcopy").addEventListener("click",async()=>{const ta=$("#rtext");try{await navigator.clipboard.writeText(ta.value);toast("已複製。","good")}catch(e){ta.focus();ta.select();toast("已選取文字，請按 Ctrl+C 或長按複製。")}});
}

/* ---- 搜尋 ---- */
let SIDX=null;
function buildIndex(){SIDX=[];for(const k in LESSONS)LESSONS[k].forEach((l,i)=>{const id=k+":"+i,add=(type,text,tab,extra)=>SIDX.push({id,k,type,text:QREF.strip(text),low:QREF.strip(text+" "+(extra||"")).toLowerCase(),tab,lt:l.t});
  add("課",l.t,"read",l.n+" "+l.g);(l.points||[]).forEach(x=>add("重點",x,"read"));(l.terms||[]).forEach(x=>add("名詞",x[0]+"："+x[1],l.words?"words":"read"));
  (l.words||[]).forEach(w=>add("生字",`${w[0]}（${w[1]}）${w[2]}`,"words"));(l.vocab||[]).forEach(v=>add("單字",`${v[0]}　${v[1]}`,"words",v[2]));(l.struct||[]).forEach(r=>add("整理",r.join("　"),"read"))})}
function openSearch(){if(!SIDX)buildIndex();OV.open("seOv",{focus:"#seIn"});const inp=$("#seIn");inp.value="";doSearch("")}
function doSearch(q){q=q.trim().toLowerCase();const box=$("#seRes");if(!q){box.innerHTML=`<p class="hint">可以搜尋 ${SIDX.length} 筆重點、生字、名詞和單字。按鍵盤「/」隨時打開搜尋。</p>`;return}
  const hit=SIDX.filter(x=>x.low.includes(q)).sort((a,b)=>(a.type==="課"?0:1)-(b.type==="課"?0:1)).slice(0,40);
  const mark=t=>{const i=t.toLowerCase().indexOf(q);if(i<0)return esc(t.slice(0,90));const a=Math.max(0,i-24);return (a?"…":"")+esc(t.slice(a,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length,i+q.length+60))+(t.length>i+q.length+60?"…":"")};
  box.innerHTML=hit.length?hit.map(x=>`<button type="button" class="sehit" data-id="${x.id}" data-tab="${x.tab}"><span class="tag" style="background:var(${SUBJECTS[x.k].color})">${SUBJECTS[x.k].name}</span><span class="pkind">${x.type}</span><span class="set">${mark(x.text)}</span><small>${esc(x.lt)}</small></button>`).join(""):`<p class="empty">找不到「${esc(q)}」。換個詞試試，例如課名或課本裡的名詞。</p>`;
  box.querySelectorAll(".sehit").forEach(b=>b.addEventListener("click",()=>{TAB[b.dataset.id]=b.dataset.tab;OV.close("seOv");go(b.dataset.id,{top:true})}))}
$("#seIn").addEventListener("input",e=>doSearch(e.target.value));$("#seClose").addEventListener("click",()=>OV.close("seOv"));

/* ---- 設定 ---- */
function openSettings(focus){const e=exam(),b=$("#stBody");
  const sync=CLOUD.state==="synced"||CLOUD.state==="saving"?"已連上你的 Claude 帳號，換一台裝置登入同一個帳號，進度會跟著走。":"目前進度只存在這台裝置的瀏覽器。清除瀏覽資料或換裝置前，請先複製備份碼。";
  b.innerHTML=`
  <section><h3>考試</h3><div class="strow2"><label for="exName">考試名稱<input type="text" id="exName" value="${esc(e.name)}" maxlength="24"></label><label for="exDate">考試日期<input type="date" id="exDate" value="${esc(e.date)}"></label></div></section>
  <section><h3>聲音與顯示</h3>
    <label class="sw2" for="pfSfx"><input type="checkbox" id="pfSfx" ${prefs().sfx?"checked":""}><span>答題音效</span></label>
    <label class="sw2" for="pfBig"><input type="checkbox" id="pfBig" ${prefs().big?"checked":""}><span>放大文字</span></label>
    ${MAP3D?`<div class="strow"><span>3D 地圖畫質</span><button type="button" id="qBtn">${MAP3D.qText()}</button></div>`:""}</section>
  <section><h3>${ICON("cloud")}進度保存</h3><p class="hint" style="margin:0">${sync}</p>
    <div class="strow"><button type="button" id="bkOut">產生備份碼</button><button type="button" id="bkIn">用備份碼還原</button></div>
    <div id="bkBox" hidden><label for="bkText" id="bkLab">備份碼</label><textarea id="bkText" rows="4" spellcheck="false"></textarea><div class="strow"><button type="button" class="pri" id="bkDo"></button><span class="hint" id="bkMsg"></span></div></div></section>
  <section><h3>重新開始</h3><div class="strow"><button type="button" class="danger" id="wipe">清除全部進度</button><span class="hint" id="wipeMsg">作答紀錄、錯題本、角色造型都會清空，無法復原。</span></div></section>`;
  OV.open("stOv",{focus:focus||"#stClose",onClose:()=>render()});
  const save=()=>{store.set("exam_v2",{name:$("#exName").value.trim()||"下一次考試",date:$("#exDate").value||e.date});renderHUD()};
  $("#exName").addEventListener("change",save);$("#exDate").addEventListener("change",save);
  $("#pfSfx").addEventListener("change",ev=>{setPref("sfx",ev.target.checked);SFX.play("ok")});$("#pfBig").addEventListener("change",ev=>setPref("big",ev.target.checked));
  const qb=$("#qBtn");if(qb)qb.addEventListener("click",()=>{MAP3D.cycleQuality();qb.textContent=MAP3D.qText()});
  const box=$("#bkBox"),ta=$("#bkText"),doB=$("#bkDo"),msg=$("#bkMsg");
  $("#bkOut").addEventListener("click",()=>{box.hidden=false;ta.readOnly=true;ta.value=exportCode();$("#bkLab").textContent="備份碼（整段複製起來，存到記事本或傳給自己）";doB.textContent="複製備份碼";msg.textContent="";doB.onclick=async()=>{try{await navigator.clipboard.writeText(ta.value);msg.textContent="已複製。"}catch(err){ta.focus();ta.select();msg.textContent="已選取，請按 Ctrl+C 或長按複製。"}};ta.focus();ta.select()});
  $("#bkIn").addEventListener("click",()=>{box.hidden=false;ta.readOnly=false;ta.value="";$("#bkLab").textContent="貼上之前複製的備份碼";doB.textContent="還原進度";msg.textContent="這台裝置現在的進度會被備份碼的內容取代。";doB.onclick=()=>{if(importCode(ta.value)){store.set(META_KEY,{ts:Date.now()});CLOUD.dirty();applyPrefs();if(MAP3D&&MAP3D.refreshAvatar)MAP3D.refreshAvatar();toast("進度還原完成。","good");OV.close("stOv")}else msg.textContent="這段備份碼讀不出來。請確認整段都有貼上，開頭是 ISLAND1."};ta.focus()});
  const w=$("#wipe");w.addEventListener("click",()=>{if(!w.dataset.sure){w.dataset.sure=1;w.textContent="再按一次，確定全部清除";$("#wipeMsg").textContent="真的要清除嗎？這個動作無法復原。";return}wipeAll();applyPrefs();if(MAP3D&&MAP3D.refreshAvatar)MAP3D.refreshAvatar();toast("全部進度已清除。");OV.close("stOv");go("hub",{top:true})})}
$("#stClose").addEventListener("click",()=>OV.close("stOv"));

/* ---- 快閃卡：翻面看答案，會了就收起來，不會的排到後面再出現 ---- */
const FC=(()=>{let q=[],n=0,known=0,flip=false,title="";
  function draw(){const b=$("#fcBody");$("#fcT").textContent=title;if(!q.length){b.innerHTML=`<div class="fcdone"><b>${n} 張全部記住了！</b><div class="subact"><button type="button" class="pri" id="fcAgain">再洗一次牌</button><button type="button" id="fcEnd">結束</button></div></div>`;SFX.play("done");
      $("#fcAgain").addEventListener("click",()=>{q=shuffle(all);known=0;flip=false;draw()});$("#fcEnd").addEventListener("click",()=>OV.close("fcOv"));return}
    const c=q[0];b.innerHTML=`<p class="fcprog">記住 ${known} / ${n} 張</p><button type="button" class="fcard${flip?" flip":""}${c.big?" big":""}" id="fcCard" aria-label="${flip?"背面":"正面，按一下翻面"}"><span class="fcf"${c.en?' lang="en"':""}>${esc(c.f)}</span>${flip?`<span class="fcb">${c.b}</span>`:`<span class="hint">按一下翻面</span>`}</button>
      <div class="subact fcact">${c.en?`<button type="button" id="fcSay">${ICON("sound")}聽發音</button>`:""}${flip?`<button type="button" id="fcNo">還不熟</button><button type="button" class="pri" id="fcYes">記住了</button>`:`<button type="button" class="pri" id="fcFlip">翻面</button>`}</div>`;
    const fl=()=>{flip=true;SFX.play("tap");draw();$("#fcYes").focus()};$("#fcCard").addEventListener("click",()=>{if(!flip)fl()});const f=$("#fcFlip");if(f)f.addEventListener("click",fl);
    const s=$("#fcSay");if(s)s.addEventListener("click",()=>speak(c.f,"en-US"));
    const y=$("#fcYes");if(y){y.addEventListener("click",()=>{q.shift();known++;flip=false;draw();const x=$("#fcFlip");if(x)x.focus()});$("#fcNo").addEventListener("click",()=>{q.push(q.shift());flip=false;draw();const x=$("#fcFlip");if(x)x.focus()})}}
  let all=[];return {open(t,cards){title=t;all=cards;q=shuffle(cards);n=cards.length;known=0;flip=false;OV.open("fcOv",{focus:"#fcClose"});draw()}}})();
$("#fcClose").addEventListener("click",()=>OV.close("fcOv"));

/* ---- 啟動 ---- */
applyPrefs();
{const r=fromHash(location.hash);if(r)ROUTE=r}
try{MAP3D=init3D()}catch(e){console.warn(e);MAP3D=null;$("#map").removeAttribute("hidden");$("#map3d").hidden=true}
render();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if(!$("#mapBox").hidden)drawMap()});
new MutationObserver(()=>{if(!$("#mapBox").hidden)drawMap()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
CLOUD.on(renderHUD);
CLOUD.init(()=>{applyPrefs();if(MAP3D&&MAP3D.refreshAvatar)MAP3D.refreshAvatar();if(!PLAYER.active&&!OV.top())render();toast("已載入你帳號裡的進度。","good")});
if(window.claude&&window.claude.use){window.claude.use("sample").then(s=>{if(s){AI=s;AI_WAIT.splice(0).forEach(f=>f())}}).catch(()=>{});window.claude.use("tts").then(t=>{TTS=t}).catch(()=>{})}

</script>
